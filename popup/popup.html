<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chrome Profile Guard</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">
    <header class="pop-head">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="7" width="40" height="34" rx="8" fill="#1A73E8" />
          <rect x="10" y="13" width="28" height="22" rx="3" fill="#FFFFFF" />
          <rect x="10" y="13" width="28" height="6" rx="3" fill="#E8F0FE" />
          <rect x="20" y="24" width="8" height="7" rx="1.4" fill="#1A73E8" />
          <path d="M21.5 24v-1.6a2.5 2.5 0 0 1 5 0V24" stroke="#1A73E8" stroke-width="1.4" fill="none" stroke-linecap="round" />
        </svg>
        <span class="brand-name">Chrome Profile Guard</span>
      </div>
    </header>

    <!-- unlocked -->
    <section class="pop-body hidden" id="view-unlocked">
      <div class="pop-status">
        <span class="pill"><span class="dot dot-green"></span>Protected</span>
      </div>
      <p class="pop-line">Workspace unlocked</p>
      <p class="pop-sub" id="autolock-line">Auto-lock: 5 min</p>
      <div class="stack" style="margin-top:14px;">
        <button class="btn btn-primary btn-block" id="lock-now">Lock now</button>
        <button class="btn btn-secondary btn-block" id="open-settings">Settings</button>
      </div>
    </section>

    <!-- locked -->
    <section class="pop-body hidden" id="view-locked">
      <div class="pop-status">
        <span class="pill"><span class="dot dot-red"></span><span id="locked-label">Locked</span></span>
      </div>
      <p class="pop-sub" id="locked-sub">Your workspace is protected.</p>
      <form id="unlock-form" novalidate style="margin-top:12px;">
        <div class="field" style="margin-bottom:8px;">
          <div class="input-wrap">
            <input id="secret" type="password" autocomplete="off" aria-label="Enter credential" placeholder="Enter PIN" />
            <button type="button" class="reveal" id="reveal" aria-label="Show">Show</button>
          </div>
          <div class="error-text" id="error" role="alert" aria-live="assertive"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="unlock">Unlock</button>
      </form>
      <button class="btn btn-ghost btn-block" id="forgot" style="margin-top:8px; font-size:12.5px;">Forgot your credential?</button>
    </section>

    <!-- setup required -->
    <section class="pop-body hidden" id="view-setup">
      <div class="pop-status">
        <span class="pill"><span class="dot dot-amber"></span>Not set up</span>
      </div>
      <p class="pop-sub">Add a PIN or password to protect this browsing workspace.</p>
      <button class="btn btn-primary btn-block" id="open-setup" style="margin-top:14px;">Set up protection</button>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
